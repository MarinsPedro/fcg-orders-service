apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-worker
  template:
    metadata:
      labels:
        app: orders-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: orders-worker
        image: fcg-orders-worker:local
        imagePullPolicy: IfNotPresent
        env:
        - name: DOTNET_ENVIRONMENT
          value: Development
        - name: ConnectionStrings__Database
          valueFrom:
            secretKeyRef:
              name: fcg-domain-dev-secrets
              key: orders-connection-string
        - name: RabbitMq__Host
          value: rabbitmq
        - name: RabbitMq__Port
          value: '5672'
        - name: RabbitMq__VirtualHost
          value: /
        - name: RabbitMq__Username
          valueFrom:
            secretKeyRef:
              name: fcg-dev-secrets
              key: rabbitmq-username
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: fcg-dev-secrets
              key: rabbitmq-password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 768Mi
